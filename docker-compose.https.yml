# 可选 HTTPS 覆盖（默认不启用）。
#
# 用法（根目录 .env 里先设置 RAGKB_TLS_MODE=https 等变量，见根 .env.example）：
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# 约束：
#   - 证书目录必须在仓库之外，且以只读方式挂载；本文件不生成任何证书。
#   - RAGKB_SERVER_NAME 必须是已配置的固定域名，容器入口脚本会严格校验；
#     80 端口只用它做 301，不会反射请求里的任意 Host。
#   - nginx 配置用仓库文件覆盖镜像内默认的 HTTP 配置（COPY 与挂载两条路径都可用）。
services:
  web:
    environment:
      RAGKB_TLS_MODE: https
      RAGKB_SERVER_NAME: ${RAGKB_SERVER_NAME:?HTTPS 模式必须设置已解析到本机的固定域名}
      RAGKB_TLS_CERT: /etc/nginx/certs/fullchain.pem
      RAGKB_TLS_KEY: /etc/nginx/certs/privkey.pem
      RAGKB_HSTS_MAX_AGE: ${RAGKB_HSTS_MAX_AGE:-31536000}
      RAGKB_TRUSTED_PROXIES: ${RAGKB_TRUSTED_PROXIES:-}
    ports:
      # 覆盖基础文件里的 "${WEB_PORT}:80"：80 只保留 ACME 校验与跳转，443 承载站点。
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # 证书与私钥：仓库外目录，只读。缺变量时 compose 直接报错而不是用默认路径。
      - ${RAGKB_TLS_CERT_DIR:?HTTPS 模式必须把 RAGKB_TLS_CERT_DIR 指向仓库外的证书目录}:/etc/nginx/certs:ro
      # ACME webroot（可选）：certbot --webroot 的校验目录，同样只读挂载到 Nginx。
      - ${RAGKB_ACME_WEBROOT:-./data/acme}:/var/www/certbot:ro
      # 用仓库里的 TLS 入口覆盖镜像内的 HTTP 入口；改配置后只需 restart web，无需重建镜像。
      - ./frontend/nginx/tls.conf:/etc/nginx/conf.d/app.conf:ro
      # 片段同样从仓库只读挂载：镜像里的 COPY 已包含它们，挂载让“改片段只 restart”也可用，
      # 两条路径都指向同一批文件，不会出现镜像内旧片段被悄悄使用的情况。
      - ./frontend/nginx/snippets:/etc/nginx/ragkb/snippets:ro
