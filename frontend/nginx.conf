# Nginx：静态托管 SPA + 反向代理 /api 到后端容器。
#
# 同源部署是关键：前端所有请求都是相对路径 /api/v1/...，
# 由本文件代理到 api 容器，浏览器不会触发跨域，也就不用放宽 CORS。

map $uri $rag_login_key {
    default "";
    /api/v1/auth/login $binary_remote_addr;
}
limit_req_zone $rag_login_key zone=rag_login:10m rate=10r/m;

upstream rag_api {
    # compose 里的服务名；容器内走 Docker 内部 DNS
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 上传是 4MB 分片，但 complete 调用与单文件上传可能更大，这里给足余量
    client_max_body_size 100m;
    client_body_timeout 300s;

    # 前端产物：带 hash 的静态资源可以长期缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        # 前端 index.html 引用了它但仓库里没有这个文件，避免每次访问都记 404
        return 204;
    }

    # 探活接口在 /api 前缀之外（后端定义在根路径 /health），
    # 不显式转发的话会被下面的 SPA fallback 当成前端路由，返回 index.html。
    location = /health {
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    # 接口文档（/docs、/redoc、/openapi.json）不对外。
    #
    # 后端在 DEBUG=false 时压根不注册这几条路由，但请求会落到 SPA fallback 返回
    # index.html——状态码 200。扫描器看到 200 会记成"端点存在"，所以这里显式 404，
    # 让"没有这几个端点"在状态码层面也成立。
    #
    # 需要临时看文档：别改这里，直接在服务器上导出，不经过 Nginx
    #   docker compose exec api python -c \
    #     "import json;from app.main import app;print(json.dumps(app.openapi(),ensure_ascii=False,indent=2))"
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location @rag_rate_limited {
        default_type application/json;
        add_header Retry-After 6 always;
        return 429 '{"code":429,"success":false,"message":"登录尝试过于频繁，请稍后重试","data":null}';
    }

    location /api/ {
        error_page 429 = @rag_rate_limited;
        limit_req zone=rag_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://rag_api;
        # 注意：proxy_pass 不带 URI，/api/v1/... 原样透传（后端前缀就是 /api/v1）
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE（/api/v1/chat/stream）：必须关闭缓冲，否则前端要等整段响应结束才收到内容。
        # 后端已回 X-Accel-Buffering: no，这里是双保险。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 兜底：前端用的是 history 路由，直接访问 /documents/<id> 刷新时必须回 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html 绝不能缓存，否则发版后用户仍加载旧的资源清单
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 直接对外的 Nginx 不信任客户端自带 X-Forwarded-For，避免绕过登录限流。
    # 前方有负载均衡器时，仅为其准确地址配置 set_real_ip_from，不能信任整个私网。
}

