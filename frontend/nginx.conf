# Nginx：静态托管 SPA + 反向代理 /api 到后端容器（默认 HTTP 模式）。
#
# 同源部署是关键：前端所有请求都是相对路径 /api/v1/...，
# 由本文件代理到 api 容器，浏览器不会触发跨域，也就不用放宽 CORS。
#
# 所有 location 与 http 级指令都在 frontend/nginx/snippets/ 下：
#   - 00-common-http.conf  map / limit_req_zone / upstream（http 级）
#   - 10-locations.conf    server 级 location
#   - 20-tls-params.conf   仅 TLS 模板使用
# HTTPS 模式由 frontend/nginx/tls.conf 覆盖使用（docker-compose.https.yml），
# 两套配置共用同一批片段，避免代理/SSE/文档屏蔽的语义漂移。

include /etc/nginx/ragkb/snippets/00-common-http.conf;

server {
    listen 80;
    server_name _;

    include /etc/nginx/ragkb/snippets/10-locations.conf;
}
