# HTTPS 模式（可选覆盖）：由 docker-compose.https.yml 挂到 /etc/nginx/conf.d/app.conf。
#
# 与 HTTP 模式共用 /etc/nginx/ragkb/snippets 下的 location 与代理片段，
# 所以 /api/v1 代理、SSE 不缓冲、上传大小、health 与 /docs 404 的语义完全一致。
#
# 域名、重定向目标和 HSTS 由容器入口脚本 40-render-ragkb.sh 渲染到
# /etc/nginx/ragkb-runtime/：域名先做严格校验，配置里的值来自校验后的文件，
# 不会把请求头 Host 反射进 Location，也不会把环境变量直接拼进 nginx 语法。
include /etc/nginx/ragkb/snippets/00-common-http.conf;

# 80：只为 ACME 校验和固定域名跳转存在。目标域名来自 RAGKB_SERVER_NAME，
# 绝不使用 $host（否则任意 Host 都能把用户带到攻击者域名）。
server {
    listen 80;
    include /etc/nginx/ragkb-runtime/server-name.conf;
    include /etc/nginx/ragkb/snippets/acme.conf;

    location / {
        include /etc/nginx/ragkb-runtime/redirect.conf;
    }
}

server {
    listen 443 ssl;
    # nginx 1.25.1+ 的写法；frontend/Dockerfile 固定 1.27 系列。
    http2 on;
    include /etc/nginx/ragkb-runtime/server-name.conf;
    include /etc/nginx/ragkb/snippets/20-tls-params.conf;

    # server 级 HSTS：nginx 的 add_header 是“全有或全无”继承，只要某个 location
    # 自己写了 add_header，就不再继承 server 级。所以这里放在 server 级，让
    # /api/、/health、favicon 等没有自带 add_header 的位置也带 HSTS；而自带
    # add_header 的 location（/assets/、@rag_rate_limited、/）在 10-locations.conf
    # 里各自再 include 一次，保证所有响应都覆盖到。
    # HTTP 模式下 hsts.conf 是空文件，include 空文件合法且不发送任何头。
    include /etc/nginx/ragkb-runtime/hsts.conf;

    include /etc/nginx/ragkb/snippets/10-locations.conf;
}
