# TLS server 级参数。只由 TLS 模板 include，HTTP 模式不会加载。
# 证书路径是固定值：由 Compose 覆盖把仓库外的目录只读挂到 /etc/nginx/certs。

ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HSTS 由 render.sh 写入 /etc/nginx/ragkb-runtime/hsts.conf，并 forwared 到
# 每个自带 add_header 的 location；这里不加，避免被 location 覆盖后语义不一致。
