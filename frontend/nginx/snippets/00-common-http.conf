# http 级公共片段：被 frontend/nginx.conf（HTTP 模式）与 TLS 模板共同 include。
# 位置固定为 /etc/nginx/ragkb/snippets/，镜像 COPY 与 Compose 只读挂载两条路径都能命中。

# 可信代理：默认空文件（不信任任何客户端自带的 X-Forwarded-For）。
# 只有管理员显式设置 RAGKB_TRUSTED_PROXIES（逗号分隔的 IP/CIDR）时，
# 入口脚本才会渲染 set_real_ip_from；值会先做字符白名单校验，避免注入。
include /etc/nginx/ragkb-runtime/real-ip.conf;

# 登录接口按客户端 IP 限流；其它请求不进入限流 key（空 key 不计数）。
map $uri $rag_login_key {
    default "";
    /api/v1/auth/login $binary_remote_addr;
}
limit_req_zone $rag_login_key zone=rag_login:10m rate=10r/m;

upstream rag_api {
    # compose 里的服务名；容器内走 Docker 内部 DNS
    server api:8000;
    keepalive 16;
}
