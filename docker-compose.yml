# 生产部署编排：db + api + worker(ingest) + worker-summary + worker-project + worker-regression + web。
#
# 数据全部落在宿主机 ${DATA_DIR}（默认 ./data）下，便于：
#   1. 挂到独立数据盘 —— 机器若被回收，换台机器把目录拷过去即可恢复；
#   2. 备份脚本直接按目录打包，不用进容器。
#
# projects 存储（PROJECT_STORAGE_DIR）是 API 与项目 worker 共用的**持久卷**：
# 内容寻址的 blob 由 project worker 写入，API 读取；不挂同一个卷就会出现
# “同步成功但引用读不到原文”。
#
# 首次部署：
#   cp backend/.env.example backend/.env    # 填写密钥，改 JWT_SECRET / ADMIN_PASSWORD
#   ./deploy/init.sh                        # 建数据目录、检查配置
#   docker compose up -d --build

name: rag-kb

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在根目录 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      # 显式固定数据目录：pg18 镜像默认是 /var/lib/postgresql/18/docker，
      # 这个路径带大版本号，写死会在升级镜像时悄悄换到新目录，导致"数据不见了"。
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ${DATA_DIR:-./data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用 pg_isready 而不是 psql：镜像里一定有它，且不依赖库名
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 不对外暴露端口：只有 compose 网络内的 api/worker 需要访问
    expose:
      - "5432"
    networks: [internal]

  api:
    build:
      context: ./backend
    # api 与 worker 跑的是同一份代码（Dockerfile 用 CMD 区分），显式指定同一个镜像名，
    # 让它们共享同一个镜像 tag 而不是各自打一个。否则 compose 会按服务名分别 tag
    # （rag-kb-api / rag-kb-worker），构建时间不同就会留下两份指向不同代码的镜像，
    # worker 悄悄跑旧代码而 api 已是新的——之前就踩过这个坑。
    image: rag-kb-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 覆盖 .env 里面向本机开发的连接串与相对路径。
      # API 不发布宿主端口，只接受受控内部网络；Nginx 会覆盖而非追加转发 IP。
      FORWARDED_ALLOW_IPS: "*"
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragdb}
      UPLOAD_DIR: /data/uploads
      LOG_DIR: /data/logs
      PROJECT_STORAGE_DIR: /data/projects
    volumes:
      # 必须与 worker 共用同一个上传目录：worker 要读取 api 落盘的文件，
      # 分片上传的 os.replace 也要求两边看到同一个文件系统
      - ${DATA_DIR:-./data}/uploads:/data/uploads
      - ${DATA_DIR:-./data}/logs:/data/logs
      # 项目 blob 存储在宿主机上由备份/恢复脚本按目录打包。API 只读取/校验，
      # 但挂载必须与 project worker 完全一致。
      - ${DATA_DIR:-./data}/projects:/data/projects
      # 默认**不**挂任何宿主机项目目录（PROJECT_ALLOWED_ROOTS 默认空）。
      # 管理员显式授权宿主机目录时，API 与 project worker 必须挂到**同一个容器路径**：
      # API 创建项目源时要对授权根做 pin 指纹（open_source_anchor），容器内看不到
      # 该路径就无法建源；worker 也要在同一路径扫描。只读即可。
      # - ${PROJECT_ROOT_HOST:-/srv/projects}:/srv/projects:ro
    depends_on:
      db:
        condition: service_healthy
    # 文件描述符上限。镜像默认软限只有 1024（硬限 524288），而每路问答流在生成期间
    # 都占着一个连接 + 一个上游连接 + 若干日志/DB fd。1024 在几百并发时就会开始
    # accept 失败（表现为客户端 "Server disconnected without sending a response"）。
    # 软限调到 65536，硬限不动：真正的天花板应交由 THREAD_POOL_SIZE 控制，
    # 而不是让它隐式地卡在 fd 上。
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [internal]

  worker:
    build:
      context: ./backend
    # 与 api 同一个镜像 tag：compose 会复用同一次构建产物，
    # `docker compose build` 也只构建一次，不会再出现 api/worker 代码版本不一致。
    image: rag-kb-backend:latest
    restart: unless-stopped
    command: ["python", "worker.py"]
    # 停写预算：与 deploy/common.sh 的 WORKER_STOP_TIMEOUT_SECONDS 同源（默认 180s）。
    # 备份/恢复先 stop worker，再在这个期限内等它跑完当前任务并退出；到期 Docker 会强杀。
    # 强杀并不丢任务：worker 靠心跳/租约把 processing 文档退回 pending 续传。
    # 因此这里只承诺“等待上限”，不能承诺每个解析/慢流任务都在该秒数内优雅完成。
    stop_grace_period: ${WORKER_STOP_TIMEOUT_SECONDS:-180}s
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragdb}
      UPLOAD_DIR: /data/uploads
      LOG_DIR: /data/logs
      PROJECT_STORAGE_DIR: /data/projects
    volumes:
      - ${DATA_DIR:-./data}/uploads:/data/uploads
      - ${DATA_DIR:-./data}/logs:/data/logs
      - ${DATA_DIR:-./data}/projects:/data/projects
    depends_on:
      db:
        condition: service_healthy
      # 等 API 起来再启动：API 负责建初始管理员，worker 只建表。
      # 让 worker 先起会抢建 admin，导致 .env 里的 ADMIN_PASSWORD 不生效。
      api:
        condition: service_healthy
    # 可按需多开做并发消费（领取任务用 FOR UPDATE SKIP LOCKED）。
    # 注意：日志用 RotatingFileHandler 写同一个 app.log，多副本时切割会互相干扰，
    # 若要 scale，先把 LOG_DIR 指到各副本独立的目录或改成只输出 stdout。
    networks: [internal]

  # ===== 独立角色 worker（按 profile 启动，默认不随 `up -d` 起）=====
  #
  # 摘要、项目同步与反馈回归重跑各自独占一个进程，避免长文档入库、模型摘要、
  # 项目扫描和后台回归互相饿死。
  # 没有开启对应功能时不要启动它们：worker-summary 消费不了任务时只是空转轮询，
  # worker-project 在 PROJECT_ALLOWED_ROOTS 为空时没有可同步的源，
  # worker-regression 只在管理员显式提交在线回归作业时才有任务（没有自动入队开关）。
  #
  # 启动方式：
  #   docker compose --profile summary up -d worker-summary       # CHAT_MEMORY_ENABLED=true 时
  #   docker compose --profile project up -d worker-project       # 配置了 PROJECT_ALLOWED_ROOTS 时
  #   docker compose --profile regression up -d worker-regression # 需要后台重跑反馈回归时
  #   docker compose --profile summary --profile project --profile regression up -d
  #
  # 维护脚本按容器标签识别“正在运行的写服务”，因此只重启原本已启动的角色。
  worker-summary:
    build:
      context: ./backend
    image: rag-kb-backend:latest
    restart: unless-stopped
    profiles: ["summary"]
    command: ["python", "worker.py", "--role", "summary"]
    stop_grace_period: ${WORKER_STOP_TIMEOUT_SECONDS:-180}s
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragdb}
      UPLOAD_DIR: /data/uploads
      LOG_DIR: /data/logs
      PROJECT_STORAGE_DIR: /data/projects
    volumes:
      - ${DATA_DIR:-./data}/uploads:/data/uploads
      - ${DATA_DIR:-./data}/logs:/data/logs
      - ${DATA_DIR:-./data}/projects:/data/projects
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal]

  worker-project:
    build:
      context: ./backend
    image: rag-kb-backend:latest
    restart: unless-stopped
    profiles: ["project"]
    command: ["python", "worker.py", "--role", "project"]
    stop_grace_period: ${WORKER_STOP_TIMEOUT_SECONDS:-180}s
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragdb}
      UPLOAD_DIR: /data/uploads
      LOG_DIR: /data/logs
      # 项目同步必须与 API 看到同一份 blob 存储（内容寻址）。
      PROJECT_STORAGE_DIR: /data/projects
    volumes:
      - ${DATA_DIR:-./data}/uploads:/data/uploads
      - ${DATA_DIR:-./data}/logs:/data/logs
      - ${DATA_DIR:-./data}/projects:/data/projects
      # 默认**不**挂任何宿主机项目目录：PROJECT_ALLOWED_ROOTS 默认空，项目源无法创建。
      # 真要索引宿主机目录时，管理员显式设置 PROJECT_ALLOWED_ROOTS，并**同时**在
      # api 与 worker-project 下取消同一行的注释（只读；容器内路径必须一致）：
      # - ${PROJECT_ROOT_HOST:-/srv/projects}:/srv/projects:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal]

  worker-regression:
    build:
      context: ./backend
    # 与 api 及 ingest/summary/project worker 同一个镜像 tag，只差启动命令。
    image: rag-kb-backend:latest
    restart: unless-stopped
    # 显式 profile：默认 `docker compose up -d` 不会启动它。
    profiles: ["regression"]
    command: ["python", "worker.py", "--role", "regression"]
    # 停写预算与 ingest/summary/project 相同，见 deploy/common.sh 的说明。
    stop_grace_period: ${WORKER_STOP_TIMEOUT_SECONDS:-180}s
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragdb}
      UPLOAD_DIR: /data/uploads
      LOG_DIR: /data/logs
      PROJECT_STORAGE_DIR: /data/projects
    # 与 API 及其他 worker 共用同一份持久存储：后台重跑要读取上传原文与项目 blob。
    volumes:
      - ${DATA_DIR:-./data}/uploads:/data/uploads
      - ${DATA_DIR:-./data}/logs:/data/logs
      - ${DATA_DIR:-./data}/projects:/data/projects
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # 默认 HTTP；HTTPS 由 docker-compose.https.yml 覆盖为 https 并补齐其余变量。
      RAGKB_TLS_MODE: ${RAGKB_TLS_MODE:-http}
      RAGKB_TRUSTED_PROXIES: ${RAGKB_TRUSTED_PROXIES:-}
    ports:
      - "${WEB_PORT:-80}:80"
    # 对外承接所有浏览器连接，同样是镜像默认的 1024 会先于 worker_connections 撞墙。
    # Nginx 主进程需要更高上限才能把 worker 的 fd 拉到 65536。
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge
